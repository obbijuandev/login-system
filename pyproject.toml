[project]
name = "base-fastapi"
version = "0.1.0"
description = "Proyecto base con FastAPI"
readme = "README.md"
requires-python = ">=3.13"
# Auth base sin dependencias extra: hashing/JWT resueltos con stdlib.
dependencies = [
    "fastapi>=0.116.1",
    "gunicorn>=24.1.1",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.10.1",
    "pytest>=8.4.1",
    "python-dotenv>=1.1.1",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.42",
    "uvicorn>=0.35.0",
]

[tool.pytest.ini_options]
pythonpath = "."
