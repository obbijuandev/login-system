services:
  web:
    build: .
    ports:
      - "8000:80"
    restart: unless-stopped
    # Docker Compose carga automáticamente el archivo .env si está en el mismo directorio
    env_file:
      - .env
    # Opcionalmente, puedes mapear variables específicas si quieres renombrarlas
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
